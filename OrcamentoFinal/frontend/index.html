<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanças Pessoais</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <h1>Controle Financeiro</h1>

        <div class="card-saldo">
            <h2>Saldo Atual</h2>
            <p id="saldo-texto">R$ 0,00</p>
        </div>

        <div class="card-form">
            <h3>Nova Transação</h3>
            <form id="form-transacao">
                <div class="input-group">
                    <label for="descricao">Descrição</label>
                    <input type="text" id="descricao" required placeholder="Ex: Salário">
                </div>

                <div class="input-group">
                    <label for="valor">Valor (R$)</label>
                    <input type="number" id="valor" step="0.01" required placeholder="0,00">
                </div>

                <div class="input-group">
                    <label for="tipo">Tipo</label>
                    <select id="tipo">
                        <option value="entrada">Entrada</option>
                        <option value="saida">Saída</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="data">Data</label>
                    <input type="date" id="data" required>
                </div>

                <button class="button_adicionar" type="submit">Adicionar</button>
            </form>
        </div>

 
    </div>

    <script src="js/script.js"></script>
</body>
</html>
